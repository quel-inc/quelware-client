syntax = "proto3";

package quelware.instrument.v1;

import "quelware/models/v1/directive.proto";
import "quelware/models/v1/instrument.proto";
import "quelware/models/v1/result.proto";

// Controls the instruments of one unit, for the session given in the
// x-session-token metadata.
//
// Within a session, each unit has at most one execution. Other sessions on the
// same unit have their own. Apply arms instruments as the session's execution,
// replacing the previous one, and Initialize clears it. FetchResult works only
// for an instrument in that execution, after it is triggered.
service InstrumentService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Clear the content of the given instruments.
  rpc Initialize(InitializeRequest) returns (InitializeResponse);
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
  // Arm the given instruments as the session's execution on this unit.
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  rpc GetClockSnapshot(GetClockSnapshotRequest) returns (GetClockSnapshotResponse);
  rpc ScheduleTrigger(ScheduleTriggerRequest) returns (ScheduleTriggerResponse);
  rpc TriggerNow(TriggerNowRequest) returns (TriggerNowResponse);
  rpc Abort(AbortRequest) returns (AbortResponse);
  // Wait until the given instrument finishes the execution, then return its
  // result.
  rpc FetchResult(FetchResultRequest) returns (FetchResultResponse);
}

message GetStatusRequest {
  string resource_id = 1;
}

message GetStatusResponse {
  quelware.models.v1.InstrumentStatus status = 1;
}

message InitializeRequest {
  reserved 1;
  repeated string resource_ids = 2;
}

message InitializeResponse {}

message ConfigureRequest {
  reserved 1;
  string resource_id = 2;
  repeated quelware.models.v1.Directive directives = 3;
  bool apply_at_end = 4;
}

message ConfigureResponse {}

message ApplyRequest {
  reserved 1;
  repeated string resource_ids = 2;
}

message ApplyResponse {}

message GetClockSnapshotRequest {}

message GetClockSnapshotResponse {
  uint64 current_count = 1;
  uint64 reference_count = 2;
}

message ScheduleTriggerRequest {
  reserved 1;
  uint64 clock_count = 2;
}

message ScheduleTriggerResponse {}

message TriggerNowRequest {
  optional uint32 requested_min_wait_ms = 1;
}

message TriggerNowResponse {
  uint64 scheduled_clock_count = 1;
}

message AbortRequest {
  repeated string resource_ids = 1;
}

message AbortResponse {}

message FetchResultRequest {
  reserved 1;
  string resource_id = 2;
}

message FetchResultResponse {
  reserved 1;
  string resource_id = 2;
  quelware.models.v1.ResultContainer result_container = 3;
}
