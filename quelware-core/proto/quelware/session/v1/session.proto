syntax = "proto3";

package quelware.session.v1;

service SessionService {
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  rpc ExtendSession(ExtendSessionRequest) returns (ExtendSessionResponse);
}

message OpenSessionRequest {
  repeated string resource_ids = 1;
  int64 tentative_ttl_ms = 2;
  int64 committed_ttl_ms = 3;
  // How long the server may keep starting new attempts to take the locks when
  // an attempt fails for a passing reason (a resource in use, a unit that
  // answered too late). The first attempt is always made. 0 makes one attempt.
  // At most 60000; a server refuses more as INVALID_ARGUMENT.
  uint64 retry_window_ms = 4;
}

message OpenSessionResponse {
  string token = 1;
  repeated string resource_ids = 2;
}

message CloseSessionRequest {
  reserved 1;
}

message CloseSessionResponse {
  bool success = 1;
}

message ExtendSessionRequest {
  int64 new_ttl_ms = 1;
}

message ExtendSessionResponse {
  bool success = 1;
}
