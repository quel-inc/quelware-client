[project]
name = "quelware-tools"
version = "0.1.3"
description = "Command-line tools and diagnostics for QuEL systems."
readme = "README.md"
authors = [
    {name = "quelware Authors", email = "opensource@quel-inc.com"},
]
requires-python = ">=3.10"
dependencies = [
    "quelware-client>=0.5.0",
    "numpy",
    "typer>=0.21.1",
]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
plot = ["matplotlib"]

[project.scripts]
quel-echo-test = "quelware_tools.cli.echo_test:cli"
quel-tone-test = "quelware_tools.cli.tone_test:cli"
quel-measure-delay = "quelware_tools.cli.measure_delay:cli"
quel-unit-config = "quelware_tools.cli.unit_config:cli"

[project.urls]
Repository = "https://github.com/quel-inc/quelware-client"
Documentation = "https://quel-inc.github.io/quelware-client/"
"Changelog" = "https://github.com/quel-inc/quelware-client/blob/main/quelware-tools/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.7",
    "ty>=0.0.1a29",
]

[tool.uv.sources]
quelware-client = { path = "../quelware-client", editable = true }
quelware-core = { path = "../quelware-core/python/", editable = true }

[tool.ruff.lint]
fixable = ["ALL"]
select = [
    "A",  # flake8-builtin
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warning
    "PL", # Pylint
    "UP", # pyupgrade
    "RUF022" # unsorted-dunder-all
]
ignore = [
    "PLR2004", # magic-value-comparison
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
]
